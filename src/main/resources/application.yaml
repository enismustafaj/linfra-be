spring:
  application:
    name: resource-app

  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: false
    generate-ddl: false

  flyway:
    locations: classpath:/migrations
    enabled: true
    out-of-order: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://www.googleapis.com/robot/v1/metadata/jwk/securetoken@system.gserviceaccount.com
          issuer-uri: https://securetoken.google.com/linfra-ai

ai:
  client:
    url: ${AI_CLIENT_URL:https://api.x.ai/v1}
    api-key: ${AI_MODEL_API_KEY:dummy-key}

resource-repository:
  local-repo-path: ${RESOURCE_REPO_PATH:src/main/resources/resource-repository}
  repo-url: ${RESOURCE_REPO_URL}
  repo-username: ${RESOURCE_REPO_USERNAME}
  repo-password: ${RESOURCE_REPO_PASSWORD}

sendgrid:
  api-key: ${SENDGRID_API_KEY}

keystore:
  password: ${KEYSTORE_PASSWORD}