server:
  port: ${PORT:8080}

spring:
  application:
    name: resource-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linfra}
    username: ${DB_USER:linfra}
    password: ${DB_PASSWORD:linfra}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks entities match it
  flyway:
    locations: classpath:/migrations
  http:
    client:
      connect-timeout: 5s
      read-timeout: 30s # bounds every LLM call; v1 had none
  ai:
    retry:
      max-attempts: 2 # Spring AI defaults to 10 with backoff: minutes of a request hanging
    openai:
      api-key: ${OPENAI_API_KEY:unset}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          temperature: 0
    model: # only chat is used
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

linfra:
  worker:
    id: ${WORKER_ID:${random.uuid}} # per process; each thread appends -<n>
    threads: ${WORKER_THREADS:4}
    poll-interval: PT1S
    lease: PT30S
    max-attempts: 5
  reconciler:
    enabled: ${LINFRA_RECONCILER_ENABLED:true}
    interval: PT1M
    stuck-after: PT2M # two leases with no live worker
  tofu:
    work-dir: ${LINFRA_TOFU_WORK_DIR:${java.io.tmpdir}/linfra-tofu}
    plugin-cache-dir: ${user.home}/.cache/linfra-tofu-plugins
    timeout: PT10M
