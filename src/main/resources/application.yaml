spring:
  application:
    name: resource-app

  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: false
    generate-ddl: false

  flyway:
    locations: classpath:/migrations
    enabled: true
    out-of-order: true

ai:
  client:
    url: ${AI_CLIENT_URL:http://localhost:1234}
    api-key: ${AI_MODEL_API_KEY:default-api-key}