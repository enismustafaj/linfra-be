name: Build and test application

on:
  pull_request:
    branches:
      - main
env:
  RESOURCE_REPO_URL: https://github.com/enismustafaj/infra-resources.git

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout
          uses: actions/checkout@v2

        - name: Set up JDK 21
          uses: actions/setup-java@v3
          with:
            java-version: '21'
            distribution: 'corretto'

        - name: Package with Maven
          run: |-
            mvn package
          env:
            AI_MODEL_API_KEY: ${{ secrets.AI_MODEL_API_KEY }}
            AI_CLIENT_URL: ${{ secrets.AI_CLIENT_URL }}
            RESOURCE_REPO_URL: ${{ env.RESOURCE_REPO_URL }}
            RESOURCE_REPO_USERNAME: ${{ secrets.RESOURCE_REPO_USERNAME }}
            RESOURCE_REPO_PASSWORD: ${{ secrets.RESOURCE_REPO_PASSWORD }}
            SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
            KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
            JWKS: ${{ secrets.JWKS }}
            INFRA_STATE_CLIENT_ID: ${{ secrets.INFRA_STATE_CLIENT_ID }}
            INFRA_STATE_CLIENT_SECRET: ${{ secrets.INFRA_STATE_CLIENT_SECRET }}
            FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
            TFBE_TOKEN: ${{ secrets.TFBE_TOKEN}}