name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven
      # Tests run against Postgres in Testcontainers; no secrets needed.
      - run: mvn -B verify

  terraform-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.9
      - uses: actions/cache@v4
        with:
          path: ~/.cache/linfra-tofu-plugins
          key: tofu-plugins-${{ hashFiles('src/main/resources/terraform/**/versions.tf') }}
      # fmt, validate and the modules' validation tests with mock providers; no cloud credentials needed.
      - name: Test modules
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.cache/linfra-tofu-plugins" # tofu does not expand ~
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for m in src/main/resources/terraform/*/; do
            (cd "$m" && tofu fmt -check -recursive && tofu init -backend=false -input=false && tofu validate && tofu test)
          done
