name: Build and Deploy to Heroku

on:
  push:
    branches: [ "main" ]
env:
  SERVICE: linfra
  RESOURCE_REPO_URL: https://github.com/enismustafaj/infra-resources

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Package with Maven
        run: |-
          mvn package
        env:
          AI_MODEL_API_KEY: ${{ secrets.AI_MODEL_API_KEY }}
          AI_CLIENT_URL: ${{ secrets.AI_CLIENT_URL }}
          RESOURCE_REPO_URL: ${{ env.RESOURCE_REPO_URL }}
          RESOURCE_REPO_USERNAME: ${{ secrets.RESOURCE_REPO_USERNAME }}
          RESOURCE_REPO_PASSWORD: ${{ secrets.RESOURCE_REPO_PASSWORD }}
          SENDGRID_API_KEY: ${{secrets.SENDGRID_API_KEY}}
          KEYSTORE_PASSWORD: ${{secrets.KEYSTORE_PASSWORD}}
          JWKS: ${{secrets.JWKS}}
          INFRA_STATE_CLIENT_ID: ${{secrets.INFRA_STATE_CLIENT_ID}}
          INFRA_STATE_CLIENT_SECRET: ${{secrets.INFRA_STATE_CLIENT_SECRET}}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          TFBE_TOKEN: ${{ secrets.TFBE_TOKEN}}

      - name: Install heroku cli
        run: |
          curl https://cli-assets.heroku.com/install-ubuntu.sh | sh

      - name: Set heroku env variables
        run: |
          heroku config:set AI_MODEL_API_KEY=${{ secrets.AI_MODEL_API_KEY }}
          heroku config:set AI_CLIENT_URL=${{ secrets.AI_CLIENT_URL }}
          heroku config:set RESOURCE_REPO_USERNAME=${{ secrets.RESOURCE_REPO_USERNAME }}
          heroku config:set RESOURCE_REPO_PASSWORD=${{ secrets.RESOURCE_REPO_PASSWORD }}
          heroku config:set SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
          heroku config:set KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          heroku config:set JWKS=${{ secrets.JWKS }}
          heroku config:set INFRA_STATE_CLIENT_ID=${{ secrets.INFRA_STATE_CLIENT_ID }}
          heroku config:set INFRA_STATE_CLIENT_SECRET=${{ secrets.INFRA_STATE_CLIENT_SECRET }}
          heroku config:set FIREBASE_CREDENTIALS=${{ secrets.FIREBASE_CREDENTIALS }}
          heroku config:set TFBE_TOKEN=${{ secrets.TFBE_TOKEN }}
          heroku config:set RESOURCE_REPO_URL=${{ secrets.RESOURCE_REPO_URL }}

      - name: Deploy to heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: ${{env.SERVICE}}
          heroku_email: ${{secrets.HEROKU_EMAIL}}
          usedocker: true
